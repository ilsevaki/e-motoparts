
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout - E-motoparts</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 2rem;
      background-color: #f7f7f7;
    }
    h2 {
      color: #111;
    }
    form {
      background-color: #fff;
      padding: 2rem;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      max-width: 500px;
      margin: auto;
    }
    label {
      display: block;
      margin-top: 1rem;
    }
    input {
      width: 100%;
      padding: 0.5rem;
      margin-top: 0.5rem;
      border-radius: 5px;
      border: 1px solid #ccc;
    }
    #resumo {
      margin-top: 2rem;
      background-color: #eee;
      padding: 1rem;
      border-radius: 5px;
    }
    button {
      margin-top: 2rem;
      padding: 0.75rem;
      background-color: #25d366;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 1rem;
    }
  </style>
</head>
<body>
  <h2>Finalizar Pedido</h2>
  <form id="formulario">
    <label>Nome Completo:
      <input type="text" required />
    </label>
    <label>Endereço:
      <input type="text" required />
    </label>
    <label>Telefone:
      <input type="tel" required />
    </label>
    <div id="resumo"></div>
    <button type="button" onclick="finalizarPagamento()">Pagar com Mercado Pago</button>
  </form>

  <script>
    const resumo = document.getElementById('resumo');
    const carrinho = JSON.parse(localStorage.getItem('carrinho')) || [];
    let total = 0;

    if (carrinho.length === 0) {
      resumo.innerHTML = '<p>Carrinho vazio.</p>';
    } else {
      let html = '<h3>Resumo do pedido:</h3><ul>';
      carrinho.forEach(item => {
        html += `<li>${item.nome} - R$ ${item.preco.toFixed(2)}</li>`;
        total += item.preco;
      });
      html += `</ul><strong>Total: R$ ${total.toFixed(2)}</strong>`;
      resumo.innerHTML = html;
    }

    function finalizarPagamento() {
      alert('Redirecionando para o Mercado Pago com total: R$ ' + total.toFixed(2));
      // Aqui você poderá futuramente usar a API do Mercado Pago para gerar o link
    }
  </script>
</body>
</html>
