<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>E-motoparts</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }
    header {
      background-color: #222;
      color: #fff;
      padding: 20px;
      text-align: center;
    }
    nav {
      display: flex;
      justify-content: center;
      background-color: #333;
    }
    nav a {
      color: white;
      text-decoration: none;
      padding: 14px 20px;
      display: block;
    }
    nav a:hover {
      background-color: #555;
    }
    .ofertas {
      background: #f2f2f2;
      padding: 20px;
      text-align: center;
    }
    .ofertas h2 {
      margin-top: 0;
    }
    .produto {
      margin: 10px 0;
    }
    .contato {
      display: flex;
      justify-content: center;
      gap: 30px;
      padding: 20px;
    }
    .contato img {
      vertical-align: middle;
    }
    .logo-whatsapp {
      width: 30px;
      height: 30px;
    }
    .logo-mercado {
      height: 30px;
    }
    .carrinho-botao {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #222;
      color: white;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
    }
    form {
      max-width: 300px;
      margin: 20px auto;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    form input, form button {
      display: block;
      width: 100%;
      margin-bottom: 10px;
      padding: 8px;
    }
  </style>
</head>
<body>

  <header>
    <h1>E-motoparts</h1>
  </header>

  <nav>
    <a href="#inicio">Início</a>
    <a href="#produtos">Produtos</a>
    <a href="#sobre">Sobre</a>
    <a href="#contato">Contato</a>
  </nav>

  <section class="ofertas" id="produtos">
    <h2>Ofertas Especiais</h2>
    <div class="produto">Pastilhas de Freio - R$ 49,90</div>
    <div class="produto">Kit Transmissão - R$ 129,90</div>
    <div class="produto">Capacete Aberto - R$ 99,90</div>
  </section>

  <form id="checkout">
    <h3>Finalizar Compra</h3>
    <input type="text" placeholder="Nome completo" required />
    <input type="text" placeholder="Endereço de entrega" required />
    <input type="tel" placeholder="Telefone para contato" required />
    <button type="submit">Confirmar e Enviar via WhatsApp</button>
  </form>

  <div class="contato" id="contato">
    <img src="assets/mercadopago.png" alt="Mercado Pago" class="logo-mercado">
    <a href="https://wa.me/seunumerodowhats" target="_blank">
      <img src="assets/whatsapp.png" alt="WhatsApp" class="logo-whatsapp">
    </a>
  </div>

  <div class="carrinho-botao" onclick="alert('Carrinho ainda em construção!')">
    Carrinho
  </div>

</body>
</html>
