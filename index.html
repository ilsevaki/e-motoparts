<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>E-motoparts</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Ícone do WhatsApp flutuante -->
  <a href="https://wa.me/5511962727074" class="whatsapp-float" target="_blank" rel="noopener">
    <img src="whatsapp.png" alt="WhatsApp" />
  </a>

  <header class="topo">
    <div class="container-header">
      
      <!-- Logo centralizado -->
      <div class="logo">
        <img src="logo.png" alt="E-motoparts">
      </div>

      <!-- Menu Hambúrguer (Mobile) -->
      <button class="menu-hamburguer" aria-label="Menu">
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
      </button>

      <!-- Menu Desktop -->
      <nav class="menu-desktop">
        <a href="#inicio">Início</a>
        <div class="dropdown">
          <a href="#produtos">Produtos ▾</a>
          <div class="dropdown-content">
            <a href="produtos/pneus.html">Pneus</a>
            <a href="produtos/lubrificantes.html">Lubrificantes</a>
            <a href="produtos/pastilhas.html">Pastilhas</a>
          </div>
        </div>
        <a href="#contato">Contato</a>
      </nav>

      <!-- Menu Mobile -->
      <nav class="menu-mobile">
        <a href="#inicio">Início</a>
        <div class="dropdown-mobile">
          <button class="dropdown">Produtos ▾</button>
          <div class="dropdown-content">
            <a href="produtos/pneus.html">Pneus</a>
            <a href="produtos/lubrificantes.html">Lubrificantes</a>
            <a href="produtos/pastilhas.html">Pastilhas</a>
          </div>
        </div>
        <a href="#contato">Contato</a>
      </nav>

      <!-- Ícones -->
      <div class="icons">
        <a href="#favoritos" title="Favoritos">
          <img src="favorito.png" alt="Favoritos">
        </a>
        <a href="#perfil" title="Perfil">
          <img src="usuário.png" alt="Perfil">
        </a>
        <a href="#carrinho" title="Carrinho">
          <img src="cart.png" alt="Carrinho" class="cart-icon" />
        </a>
      </div>
    </div>
  </header>

  <main>
    <section class="destaque" id="inicio">
      <h1>Bem-vindo à E-motoparts</h1>
      <p>Sua loja online de motopeças com os melhores preços</p>
      <h2>Promoções!</h2>
      <p>Escolha uma categoria de produtos no menu acima e veja os itens em promoções.</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
