<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-motoparts</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <!-- WhatsApp flutuante -->
  <a href="https://wa.me/5511962727074" class="whatsapp-float" target="_blank" rel="noopener">
    <img src="assets/img/whatsapp.png" alt="WhatsApp">
  </a>

  <header class="topo">
    <div class="container-header">
      <!-- Logo -->
      <div class="logo">
        <img src="assets/img/logo.png" alt="E-motoparts">
      </div>

      <!-- Barra de Pesquisa -->
      <div class="barra-pesquisa-container">
        <div class="barra-pesquisa">
          <input type="text" placeholder="Buscar peças...">
          <button><i class="fas fa-search"></i></button>
        </div>
      </div>

      <!-- Ícones -->
      <div class="acoes-header">
        <button class="menu-hamburguer" aria-label="Menu">
          <span class="bar"></span>
          <span class="bar"></span>
          <span class="bar"></span>
        </button>
        
        <div class="icons">
          <a href="#favoritos"><i class="far fa-heart"></i></a>
          <a href="#perfil"><i class="far fa-user"></i></a>
          <a href="#carrinho" id="abrir-carrinho">
            <i class="fas fa-shopping-cart"></i>
            <span class="cart-count"></span>
          </a>
        </div>
      </div>
    </div>

    <!-- Menu Principal -->
    <nav class="menu-principal">
      <a href="#inicio">Início</a>
      <div class="dropdown">
        <a href="#produtos">Produtos ▾</a>
        <div class="dropdown-content">
          <a href="produtos/pneus.html">Pneus</a>
          <a href="produtos/lubrificantes.html">Lubrificantes</a>
          <a href="produtos/pastilhas.html">Pastilhas</a>
        </div>
      </div>
      <a href="#contato">Contato</a>
    </nav>
  </header>

  <main>
    <!-- Seção Destaque -->
    <section class="destaque" id="inicio">
      <h1>Bem-vindo à E-motoparts</h1>
      <p>Sua loja online de motopeças com os melhores preços</p>
    </section>

    <!-- Carrossel de Produtos -->
    <section class="carrossel">
      <h2>Produtos em Destaque</h2>
      <div class="carrossel-container">
        <div class="carrossel-item">
          <img src="assets/img/produtos/pneu1.jpg" alt="Pneu Dianteiro" loading="lazy">
          <h3>Pneu Dianteiro</h3>
          <p>R$ 249,90</p>
          <button onclick="adicionarAoCarrinho('Pneu Dianteiro', 249.90, 'pneu1')">Adicionar ao Carrinho</button>
        </div>
        <div class="carrossel-item">
          <img src="assets/img/produtos/lubrificante1.jpg" alt="Óleo 20W50" loading="lazy">
          <h3>Óleo 20W50</h3>
          <p>R$ 39,90</p>
          <button onclick="adicionarAoCarrinho('Óleo 20W50', 39.90, 'lub1')">Adicionar ao Carrinho</button>
        </div>
      </div>
      <div class="carrossel-controles">
        <button class="carrossel-anterior">❮</button>
        <button class="carrossel-proximo">❯</button>
      </div>
    </section>

    <!-- Modal do Carrinho -->
    <div id="carrinho-modal" class="modal">
      <div class="modal-conteudo">
        <span class="fechar-modal">&times;</span>
        <h2>Seu Carrinho</h2>
        <ul id="itens-carrinho"></ul>
        <div id="total">Total: R$ 0,00</div>
        <button id="finalizar-compra">Finalizar Compra</button>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
