<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>E-motoparts</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Ícone do WhatsApp flutuante -->
  <a href="https://wa.me/5511962727074" class="whatsapp-float" target="_blank" rel="noopener noreferrer" aria-label="Contato via WhatsApp">
    <img src="whatsapp.png" alt="WhatsApp" width="60" height="60" loading="lazy">
  </a>

  <header class="topo">
    <div class="container-header">
      
      <!-- Logo centralizado -->
      <div class="logo">
        <img src="logo.png" alt="E-motoparts" width="180" height="60" loading="eager">
      </div>

      <!-- Menu Hambúrguer (Mobile) -->
      <button class="menu-hamburguer" aria-label="Menu" aria-expanded="false">
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
      </button>

      <!-- Menu Mobile (oculto por padrão) -->
      <nav class="menu-mobile" aria-hidden="true">
        <a href="#inicio" class="mobile-link">Início</a>
        
        <!-- Item com Submenu -->
        <div class="menu-mobile-item">
          <button class="menu-mobile-btn" aria-expanded="false">Produtos ▾</button>
          <div class="submenu-mobile">
            <a href="produtos/pneus.html" class="mobile-link">Pneus</a>
            <a href="produtos/lubrificantes.html" class="mobile-link">Lubrificantes</a>
            <a href="produtos/pastilhas.html" class="mobile-link">Pastilhas</a>
          </div>
        </div>
        
        <a href="#contato" class="mobile-link">Contato</a>
      </nav>
      
      <!-- Menu Desktop -->
      <nav class="menu-desktop" aria-label="Navegação principal">
        <a href="#inicio">Início</a>

        <div class="dropdown">
          <button class="dropdown-btn" aria-expanded="false" aria-haspopup="true">
            Produtos ▾
          </button>
          <div class="dropdown-content">
            <a href="produtos/pneus.html">Pneus</a>
            <a href="produtos/lubrificantes.html">Lubrificantes</a>
            <a href="produtos/pastilhas.html">Pastilhas</a>
          </div>
        </div>

        <a href="#contato">Contato</a>
      </nav>

      <!-- Ícones -->
      <div class="icons">
        <a href="#favoritos" title="Favoritos" aria-label="Favoritos">
          <img src="favorito.png" alt="Favoritos" width="24" height="24" loading="lazy">
        </a>
        <a href="#perfil" title="Perfil" aria-label="Perfil do usuário">
          <img src="usuário.png" alt="Perfil" width="24" height="24" loading="lazy">
        </a>
        <a href="#carrinho" title="Carrinho" aria-label="Carrinho de compras">
          <img src="cart.png" alt="Carrinho" class="cart-icon" width="24" height="24" loading="lazy">
          <span class="cart-count">0</span>
        </a>
      </div>
    </div>
  </header>

  <main>
    <section class="destaque" id="inicio">
      <h1>Bem-vindo à E-motoparts</h1>
      <p>Sua loja online de motopeças com os melhores preços</p>
      <h2>Promoções!</h2>
      <p>Escolha uma categoria de produtos no menu acima e veja os itens em promoções.</p>
      <a href="#produtos" class="cta-button">Ver Produtos</a>
    </section>
  </main>

  <script>
    // Menu Hambúrguer
    document.addEventListener('DOMContentLoaded', () => {
      const hamburguer = document.querySelector('.menu-hamburguer');
      const menuMobile = document.querySelector('.menu-mobile');
      const mobileLinks = document.querySelectorAll('.mobile-link');
      const mobileBtn = document.querySelector('.menu-mobile-btn');
      
      // Abrir/Fechar menu principal
      hamburguer.addEventListener('click', () => {
        const isExpanded = hamburguer.getAttribute('aria-expanded') === 'true';
        hamburguer.setAttribute('aria-expanded', !isExpanded);
        hamburguer.classList.toggle('active');
        menuMobile.setAttribute('aria-hidden', isExpanded);
        document.body.style.overflow = isExpanded ? 'auto' : 'hidden';
      });

      // Submenu Mobile
      mobileBtn.addEventListener('click', () => {
        const submenu = document.querySelector('.submenu-mobile');
        const isExpanded = mobileBtn.getAttribute('aria-expanded') === 'true';
        mobileBtn.setAttribute('aria-expanded', !isExpanded);
        submenu.classList.toggle('active');
      });

      // Fechar menu ao clicar em links
      mobileLinks.forEach(link => {
        link.addEventListener('click', () => {
          hamburguer.classList.remove('active');
          menuMobile.setAttribute('aria-hidden', 'true');
          hamburguer.setAttribute('aria-expanded', 'false');
          document.body.style.overflow = 'auto';
        });
      });

      // Dropdown Desktop
      const dropdownBtn = document.querySelector('.dropdown-btn');
      dropdownBtn.addEventListener('click', () => {
        const isExpanded = dropdownBtn.getAttribute('aria-expanded') === 'true';
        dropdownBtn.setAttribute('aria-expanded', !isExpanded);
      });
    });

    function scrollToTop() {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  </script>
</body>
</html>
