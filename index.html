<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>E-motoparts</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
    }
    header, footer {
      background-color: #111;
      color: white;
      text-align: center;
      padding: 1rem;
    }
    nav {
      background: #222;
      padding: 0.5rem;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
    }
    nav a {
      color: white;
      text-decoration: none;
      margin: 0.5rem 1rem;
      padding: 0.5rem 1rem;
      border-radius: 5px;
    }
    nav a:hover {
      background: #25d366;
    }
    main {
      padding: 2rem 1rem;
      max-width: 1000px;
      margin: auto;
    }
    .intro {
      background: white;
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      text-align: center;
    }
    .intro img {
      width: 180px;
      margin: 1rem auto;
    }
    @media (max-width: 600px) {
      nav {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>E-motoparts</h1>
    <p>As melhores peças para sua moto com atendimento direto pelo WhatsApp</p>
  </header>
  <nav>
    <a href="index.html">Início</a>
    <a href="produtos.html">Produtos</a>
    <a href="checkout.html">Finalizar Pedido</a>
  </nav>
  <main>
    <div class="intro">
      <h2>Bem-vindo à E-motoparts</h2>
      <p>Peças e acessórios de qualidade para sua moto. Atendimento rápido e personalizado!</p>
      <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" alt="WhatsApp" />
      <img src="https://upload.wikimedia.org/wikipedia/commons/e/e3/Mercado_Pago_logo.svg" alt="Mercado Pago" style="width:160px"/>
    </div>
  </main>
  <footer>
    &copy; 2025 E-motoparts. Todos os direitos reservados.
  </footer>
</body>
</html>
