<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>E-motoparts</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <img src="logo.png" alt="Logo E-motoparts" class="logo" />
    <nav class="menu-horizontal">
      <a href="#inicio">Início</a>
      <a href="#produtos">Produtos</a>
      <a href="#contato">Contato</a>
    </nav>
    <div class="carrinho-icon" onclick="abrirCarrinho()">🛒</div>
  </header>

  <main id="inicio">
    <section class="ofertas">
      <h2>Ofertas</h2>
      <div class="produto">
        <img src="produto1.jpg" alt="Produto 1" />
        <h3>Kit Relação Honda</h3>
        <p>R$ 120,00</p>
        <button onclick="adicionarAoCarrinho('Kit Relação Honda', 120)">Comprar</button>
      </div>
    </section>

    <section id="produtos">
      <h2>Todos os Produtos</h2>
      <div class="produto">
        <img src="produto1.jpg" alt="Produto 1" />
        <h3>Kit Relação Honda</h3>
        <p>R$ 120,00</p>
        <button onclick="adicionarAoCarrinho('Kit Relação Honda', 120)">Comprar</button>
      </div>
    </section>
  </main>

  <footer id="contato">
    <p>Contato pelo WhatsApp:</p>
    <a href="https://wa.me/5511999999999" target="_blank">
      <img src="whatsapp.png" alt="WhatsApp" class="icon pequeno" />
    </a>
    <p>Pagamentos via</p>
    <img src="mercadopago.png" alt="Mercado Pago" class="icon" />
  </footer>

  <div id="carrinho" class="carrinho">
    <h2>Carrinho</h2>
    <ul id="itens-carrinho"></ul>
    <p id="total">Total: R$ 0,00</p>
    <button onclick="finalizarCompra()">Finalizar Compra</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
