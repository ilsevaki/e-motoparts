<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Motos Parts - Peças e Acessórios</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <!-- Topo/Navegação -->
  <header class="topo">
    <div class="container">
      <div class="logo">
        <img src="https://via.placeholder.com/150x50?text=MotosParts" alt="Logo">
      </div>
      
      <div class="menu-mobile">
        <i class="fas fa-bars"></i>
      </div>
      
      <nav class="menu-principal">
        <ul>
          <li><a href="#">Início</a></li>
          <li class="dropdown">
            <a href="#">Peças <i class="fas fa-chevron-down"></i></a>
            <div class="dropdown-content">
              <a href="#">Motor</a>
              <a href="#">Freios</a>
              <a href="#">Suspensão</a>
            </div>
          </li>
          <li><a href="#">Promoções</a></li>
          <li><a href="#">Contato</a></li>
        </ul>
      </nav>
      
      <div class="acoes">
        <div class="barra-pesquisa">
          <input type="text" placeholder="Buscar...">
          <button><i class="fas fa-search"></i></button>
        </div>
        <div class="carrinho-icon">
          <i class="fas fa-shopping-cart"></i>
          <span class="cart-count">0</span>
        </div>
      </div>
    </div>
  </header>

  <!-- Carrossel -->
  <section class="carrossel">
    <div class="carrossel-container">
      <div class="carrossel-item ativo">
        <img src="https://via.placeholder.com/1200x400?text=Banner+1" alt="Banner 1">
      </div>
      <div class="carrossel-item">
        <img src="https://via.placeholder.com/1200x400?text=Banner+2" alt="Banner 2">
      </div>
    </div>
    <button class="carrossel-anterior"><i class="fas fa-chevron-left"></i></button>
    <button class="carrossel-proximo"><i class="fas fa-chevron-right"></i></button>
  </section>

  <!-- Produtos -->
  <section class="produtos">
    <h2>Produtos em Destaque</h2>
    <div class="produtos-grid">
      <div class="produto-card">
        <img src="https://via.placeholder.com/300x200?text=Produto+1" alt="Produto 1">
        <h3>Pastilha de Freio</h3>
        <p class="preco">R$ 89,90</p>
        <button class="btn-comprar" onclick="adicionarAoCarrinho('Pastilha de Freio', 89.90, 'prod1')">Comprar</button>
      </div>
      <!-- Mais produtos... -->
    </div>
  </section>

  <!-- Modal Carrinho -->
  <div id="carrinho-modal" class="modal">
    <div class="modal-conteudo">
      <span class="fechar-modal">&times;</span>
      <h2>Seu Carrinho</h2>
      <ul id="itens-carrinho"></ul>
      <div id="total">Total: R$ 0,00</div>
      <button id="finalizar-compra">Finalizar Compra</button>
    </div>
  </div>

  <!-- Rodapé -->
  <footer>
    <div class="rodape-coluna">
      <h4>Institucional</h4>
      <a href="#">Sobre Nós</a>
      <a href="#">Políticas</a>
    </div>
    <div class="rodape-coluna">
      <h4>Atendimento</h4>
      <p><i class="fas fa-envelope"></i> contato@motosparts.com.br</p>
      <p><i class="fas fa-phone"></i> (11) 9999-9999</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
