<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Produtos - E-motoparts</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
    }
    header, footer {
      background-color: #111;
      color: white;
      text-align: center;
      padding: 1rem;
    }
    nav {
      background: #222;
      padding: 0.5rem;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
    }
    nav a {
      color: white;
      text-decoration: none;
      margin: 0.5rem 1rem;
      padding: 0.5rem 1rem;
      border-radius: 5px;
    }
    nav a:hover {
      background: #25d366;
    }
    main {
      padding: 2rem 1rem;
      max-width: 1000px;
      margin: auto;
    }
    .produtos {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1rem;
    }
    .card {
      background: white;
      border-radius: 8px;
      box-shadow: 0 0 8px rgba(0,0,0,0.1);
      padding: 1rem;
      text-align: center;
    }
    .card img {
      width: 100%;
      height: 150px;
      object-fit: contain;
    }
    .card button {
      background: #25d366;
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      margin-top: 0.5rem;
      border-radius: 5px;
      cursor: pointer;
    }
    .card button:hover {
      background: #1ebe56;
    }
  </style>
</head>
<body>
  <header>
    <h1>E-motoparts</h1>
  </header>
  <nav>
    <a href="index.html">Início</a>
    <a href="produtos.html">Produtos</a>
    <a href="checkout.html">Finalizar Pedido</a>
  </nav>
  <main>
    <h2>Nossos Produtos</h2>
    <div class="produtos">
      <div class="card">
        <img src="https://via.placeholder.com/150x100.png?text=Pastilha+de+Freio" alt="Pastilha de Freio">
        <h3>Pastilha de Freio</h3>
        <p>R$ 45,00</p>
        <button onclick="addToCart('Pastilha de Freio', 45)">Adicionar</button>
      </div>
      <div class="card">
        <img src="https://via.placeholder.com/150x100.png?text=Kit+Transmissão" alt="Kit Transmissão">
        <h3>Kit Transmissão</h3>
        <p>R$ 120,00</p>
        <button onclick="addToCart('Kit Transmissão', 120)">Adicionar</button>
      </div>
    </div>
  </main>
  <footer>
    &copy; 2025 E-motoparts
  </footer>
  <script>
    function addToCart(produto, preco) {
      let carrinho = JSON.parse(localStorage.getItem("carrinho")) || [];
      carrinho.push({ produto, preco });
      localStorage.setItem("carrinho", JSON.stringify(carrinho));
      alert(`${produto} adicionado ao carrinho!`);
    }
  </script>
</body>
</html>
