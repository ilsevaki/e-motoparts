<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Produtos - E-motoparts</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    h1 {
      text-align: center;
    }
    .produto {
      border: 1px solid #ccc;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 15px;
    }
    .produto h2 {
      margin: 0 0 10px 0;
    }
    .produto button {
      background-color: #222;
      color: white;
      padding: 10px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h1>Nossos Produtos</h1>

  <div class="produto">
    <h2>Pastilha de Freio</h2>
    <p>Compatível com várias motos | R$ 49,90</p>
    <button onclick="window.location.href='checkout.html'">Comprar</button>
  </div>

  <div class="produto">
    <h2>Kit Relação</h2>
    <p>Corrente, coroa e pinhão | R$ 129,90</p>
    <button onclick="window.location.href='checkout.html'">Comprar</button>
  </div>

  <div class="produto">
    <h2>Capacete Aberto</h2>
    <p>Proteção e estilo para o dia a dia | R$ 99,90</p>
    <button onclick="window.location.href='checkout.html'">Comprar</button>
  </div>

</body>
</html>
